    I'm <tspan fill="#FFFFFF" font-weight="600">Abdul Wasay Ali</tspan> — a passionate Software Engineering student based in <tspan fill="#FFFFFF" font-weight="500">Karachi, Pakistan</tspan>.
  </text>

  <!-- Paragraph 2 -->
  <text x="24" y="100" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400">
    I am currently pursuing a <tspan fill="#FFFFFF" font-weight="500">Diploma in Software Engineering</tspan>, and continuing my Intermediate studies also from <tspan fill="#FFFFFF" font-weight="500">Aptech (SBTE)</tspan>.
  </text>

  <!-- Paragraph 3 -->
  <text x="24" y="132" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400">
    Through my academic journey, I have developed a strong passion for technology and real-world problem-solving. I have worked on several
  </text>
  <text x="24" y="153" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400">
    academic and personal projects that have strengthened my practical understanding of software development across mobile &amp; web platforms.
  </text>

  <!-- Paragraph 4 -->
  <text x="24" y="185" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400">
