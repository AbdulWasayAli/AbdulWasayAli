<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" role="img" aria-label="About Me Card">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091611" />
      <stop offset="50%" stop-color="#07120D" />
      <stop offset="100%" stop-color="#050E0A" />
    </linearGradient>
  </defs>

  <!-- Card Background & Border -->
  <rect x="0.5" y="0.5" width="859" height="279" rx="8" fill="url(#cardBg)" stroke="#1F4D38" stroke-width="1.2" />

  <!-- Main Headline -->
  <text x="24" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="0.2">
    Aspiring Software Engineer <tspan fill="#ffffff">|</tspan> Mobile App Developer <tspan fill="#ffffff">|</tspan> Flutter &amp; Dart <tspan fill="#ffffff">|</tspan> MERN Stack <tspan fill="#ffffff">|</tspan> Firebase &amp; REST API Integration
  </text>

  <!-- Paragraph 1 -->
