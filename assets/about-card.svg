  </text>
  <text x="24" y="206" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400">
    to grow further and gain hands-on experience in the tech industry.
  </text>

  <!-- Paragraph 5 -->
  <text x="24" y="238" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.2" font-weight="400">
    My goal is to become a skilled software engineer who contributes meaningfully to innovative and impactful technology solutions.
