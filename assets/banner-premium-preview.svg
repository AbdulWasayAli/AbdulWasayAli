<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="680" viewBox="0 0 2400 680" role="img" aria-labelledby="title desc">
  <title id="title">Abdul Wasay Ali — Software Engineer</title>
  <desc id="desc">A refined dark emerald developer portfolio banner for Abdul Wasay Ali.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07120f"/>
      <stop offset="0.48" stop-color="#091d18"/>
      <stop offset="1" stop-color="#06110e"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientTransform="translate(480 80) rotate(36) scale(930 600)">
      <stop stop-color="#10b981" stop-opacity=".22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientTransform="translate(1940 340) rotate(20) scale(710 570)">
      <stop stop-color="#36d399" stop-opacity=".19"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#34d399" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#6ee7b7" stop-opacity=".9"/>
      <stop offset="1" stop-color="#34d399" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#112b23" stop-opacity=".96"/>
      <stop offset="1" stop-color="#071611" stop-opacity=".97"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#6ee7b7" stroke-opacity=".065" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.4" fill="#6ee7b7" fill-opacity=".2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020806" flood-opacity=".72"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="2400" height="680" fill="url(#base)"/>
  <rect width="2400" height="680" fill="url(#glowLeft)"/>
  <rect width="2400" height="680" fill="url(#glowRight)"/>
  <rect x="0" y="0" width="2400" height="680" fill="url(#grid)"/>
  <path d="M0 97H2400" stroke="url(#edge)" stroke-width="1" opacity=".75"/>
  <path d="M0 614H2400" stroke="url(#edge)" stroke-width="1" opacity=".35"/>
  <path d="M72 0V680M2328 0V680" stroke="#5eead4" stroke-opacity=".13"/>

  <!-- Framing marks -->
  <g fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="square">
    <path d="M28 62V28H62M2338 28H2372V62M28 618V652H62M2338 652H2372V618" opacity=".9"/>
  </g>

  <!-- Identity -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(132 137)">
      <rect width="341" height="42" rx="21" fill="#0b2c22" stroke="#2dd4a2" stroke-opacity=".7"/>
      <circle cx="24" cy="21" r="6" fill="#5eead4"/>
      <circle cx="24" cy="21" r="11" fill="none" stroke="#5eead4" stroke-opacity=".36"/>
      <text x="45" y="27" fill="#a7f3d0" font-size="16" font-weight="700" letter-spacing="2">AVAILABLE TO BUILD</text>
    </g>
    <text x="128" y="286" fill="#f8fffb" font-size="77" font-weight="750" letter-spacing="-2.7">Abdul Wasay Ali</text>
    <rect x="132" y="318" width="82" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="132" y="380" fill="#c7f9e5" font-size="28" font-weight="450" letter-spacing=".2">Software Engineer  <tspan fill="#59dcb1">·</tspan>  Mobile &amp; Full-Stack Developer</text>
    <text x="132" y="421" fill="#89ae9f" font-size="18" letter-spacing=".3">CRAFTING ACCESSIBLE, SCALABLE DIGITAL EXPERIENCES</text>

    <!-- Capability chips -->
    <g transform="translate(132 495)" font-size="16" font-weight="700" letter-spacing=".9">
      <g>
        <rect width="154" height="44" rx="12" fill="#0b281f" stroke="#2dd4a2" stroke-opacity=".46"/>
        <circle cx="21" cy="22" r="5" fill="#5eead4"/>
        <text x="38" y="28" fill="#c9f9e6">FLUTTER</text>
      </g>
      <g transform="translate(166)">
        <rect width="132" height="44" rx="12" fill="#0b281f" stroke="#2dd4a2" stroke-opacity=".46"/>
        <circle cx="21" cy="22" r="5" fill="#5eead4"/>
        <text x="38" y="28" fill="#c9f9e6">MERN</text>
      </g>
      <g transform="translate(310)">
        <rect width="126" height="44" rx="12" fill="#0b281f" stroke="#2dd4a2" stroke-opacity=".46"/>
        <circle cx="21" cy="22" r="5" fill="#5eead4"/>
        <text x="38" y="28" fill="#c9f9e6">AI/ML</text>
      </g>
    </g>
  </g>

  <!-- Editorial divider -->
  <g transform="translate(1160 168)">
    <rect width="1" height="340" fill="#5eead4" opacity=".26"/>
    <circle cx=".5" cy="0" r="5" fill="#5eead4"/>
    <circle cx=".5" cy="340" r="5" fill="#5eead4"/>
  </g>

  <!-- Abstract product / code panel -->
  <g transform="translate(1290 129)" filter="url(#shadow)">
    <rect width="890" height="410" rx="20" fill="url(#panel)" stroke="#6ee7b7" stroke-opacity=".45"/>
    <rect x="0.5" y="0.5" width="889" height="58" rx="20" fill="#0d241d"/>
    <path d="M0 58.5H890" stroke="#6ee7b7" stroke-opacity=".2"/>
    <circle cx="30" cy="29" r="6" fill="#fb7185"/>
    <circle cx="52" cy="29" r="6" fill="#fbbf24"/>
    <circle cx="74" cy="29" r="6" fill="#34d399"/>
    <text x="108" y="35" fill="#91c9b3" font-family="Consolas, monospace" font-size="15" letter-spacing=".6">portfolio.config.ts</text>

    <g font-family="Consolas, Cascadia Code, monospace" font-size="18">
      <text x="44" y="108" fill="#527e6c">01</text>
      <text x="89" y="108" fill="#a7f3d0"><tspan fill="#f0abfc">const</tspan> engineer = {</text>
      <text x="44" y="151" fill="#527e6c">02</text>
      <text x="121" y="151" fill="#a7f3d0">focus: <tspan fill="#fde68a">'impactful products'</tspan>,</text>
      <text x="44" y="194" fill="#527e6c">03</text>
      <text x="121" y="194" fill="#a7f3d0">stack: [<tspan fill="#86efac">'Flutter'</tspan>, <tspan fill="#86efac">'React'</tspan>, <tspan fill="#86efac">'Node'</tspan>],</text>
      <text x="44" y="237" fill="#527e6c">04</text>
      <text x="121" y="237" fill="#a7f3d0">status: <tspan fill="#5eead4">'shipping'</tspan></text>
      <text x="89" y="280" fill="#a7f3d0">};</text>
      <text x="44" y="337" fill="#527e6c">05</text>
      <text x="89" y="337" fill="#d1fae5"><tspan fill="#f0abfc">export default</tspan> engineer;</text>
    </g>

    <g transform="translate(602 106)">
      <rect width="226" height="210" rx="15" fill="#0a1f18" stroke="#43d9a4" stroke-opacity=".36"/>
      <circle cx="113" cy="71" r="38" fill="#0f3f30"/>
      <path d="M100 71l10 10 21-24" fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="113" y="142" text-anchor="middle" fill="#e7fff5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">BUILD MODE</text>
      <text x="113" y="169" text-anchor="middle" fill="#89ae9f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">ideas → products</text>
    </g>
  </g>

  <!-- Bottom metadata -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="1.2">
    <text x="132" y="596" fill="#5c8d7c">KARACHI, PAKISTAN</text>
    <text x="2125" y="596" fill="#5c8d7c">2026 · 01</text>
  </g>
</svg>
