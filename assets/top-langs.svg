<svg width="410" height="200" viewBox="0 0 410 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Top Languages">
  <title id="titleId">Top Languages</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #82e3b7; }
    .lang-name { font: 400 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
  </style>
  <rect x="0.5" y="0.5" rx="12" height="199" stroke="#1F4A38" stroke-width="1.2" width="409" fill="#0B1410" />
  
  <text x="25" y="35" class="header">Most Used Languages</text>

  <!-- Progress bar -->
  <g transform="translate(25, 65)">
    <mask id="rect-mask">
      <rect x="0" y="0" width="360" height="8" fill="white" rx="4"/>
    </mask>
    <rect mask="url(#rect-mask)" x="0" y="0" width="102.2" height="8" fill="#f1e05a" />
    <rect mask="url(#rect-mask)" x="102.2" y="0" width="91.6" height="8" fill="#e34c26" />
    <rect mask="url(#rect-mask)" x="193.8" y="0" width="88.9" height="8" fill="#663399" />
    <rect mask="url(#rect-mask)" x="282.7" y="0" width="56.5" height="8" fill="#00B4AB" />
    <rect mask="url(#rect-mask)" x="339.2" y="0" width="20.8" height="8" fill="#4F5D95" />
  </g>

  <!-- Language items -->
  <g transform="translate(25, 95)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="10" r="5" fill="#f1e05a" />
      <text x="18" y="14" class="lang-name">JavaScript 28.40%</text>
    </g>
    <g transform="translate(0, 27)">
      <circle cx="5" cy="10" r="5" fill="#e34c26" />
      <text x="18" y="14" class="lang-name">HTML 25.43%</text>
    </g>
    <g transform="translate(0, 54)">
      <circle cx="5" cy="10" r="5" fill="#663399" />
      <text x="18" y="14" class="lang-name">CSS 24.70%</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(185, 0)">
      <circle cx="5" cy="10" r="5" fill="#00B4AB" />
      <text x="18" y="14" class="lang-name">Dart 15.70%</text>
    </g>
    <g transform="translate(185, 27)">
      <circle cx="5" cy="10" r="5" fill="#4F5D95" />
      <text x="18" y="14" class="lang-name">PHP 5.77%</text>
    </g>
  </g>
</svg>