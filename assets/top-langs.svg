<svg width="350" height="195" viewBox="0 0 350 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Top Languages">
  <title id="titleId">Top Languages</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #82e3b7; }
    .lang-name { font: 400 12px "Segoe UI", Ubuntu, Sans-Serif; fill: #c9d1d9; }
  </style>
  <rect x="0.5" y="0.5" rx="12" height="194" stroke="#1F4A38" stroke-width="1.2" width="349" fill="#0B1410" />
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>
  <g transform="translate(25, 65)">
    <!-- Progress bar -->
    <mask id="rect-mask">
      <rect x="0" y="0" width="300" height="8" fill="white" rx="4"/>
    </mask>
    <rect mask="url(#rect-mask)" x="0" y="0" width="85.2" height="8" fill="#f1e05a" />
    <rect mask="url(#rect-mask)" x="85.2" y="0" width="76.3" height="8" fill="#e34c26" />
    <rect mask="url(#rect-mask)" x="161.5" y="0" width="74.1" height="8" fill="#663399" />
    <rect mask="url(#rect-mask)" x="235.6" y="0" width="47.1" height="8" fill="#00B4AB" />
    <rect mask="url(#rect-mask)" x="282.7" y="0" width="17.3" height="8" fill="#4F5D95" />
    <!-- Language items -->
    <g transform="translate(0, 30)">
      <g transform="translate(0, 0)">
        <circle cx="5" cy="6" r="5" fill="#f1e05a" />
        <text x="16" y="10" class="lang-name">JavaScript 28.40%</text>
      </g>
      <g transform="translate(0, 26)">
        <circle cx="5" cy="6" r="5" fill="#e34c26" />
        <text x="16" y="10" class="lang-name">HTML 25.43%</text>
      </g>
      <g transform="translate(0, 52)">
        <circle cx="5" cy="6" r="5" fill="#663399" />
        <text x="16" y="10" class="lang-name">CSS 24.70%</text>
      </g>
      <g transform="translate(160, 0)">
        <circle cx="5" cy="6" r="5" fill="#00B4AB" />
        <text x="16" y="10" class="lang-name">Dart 15.70%</text>
      </g>
      <g transform="translate(160, 26)">
        <circle cx="5" cy="6" r="5" fill="#4F5D95" />
        <text x="16" y="10" class="lang-name">PHP 5.77%</text>
      </g>
    </g>
  </g>
</svg>