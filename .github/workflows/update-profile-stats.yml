name: Update profile stats cards

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=AbdulWasayAli&show_icons=true&hide_rank=false&custom_title=My%20GitHub%20Statistics&theme=transparent&hide_border=false&border_color=1F4A38&border_radius=12&title_color=82e3b7&text_color=c9d1d9&icon_color=56d6a3&bg_color=0B1410"
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=AbdulWasayAli&layout=compact&langs_count=5&size_weight=0.5&count_weight=0.5&theme=transparent&hide_border=false&border_color=1F4A38&border_radius=12&title_color=82e3b7&text_color=c9d1d9&bg_color=0B1410"
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Normalize cards to matching 467x195 layout
        run: python scripts/normalize_cards.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update profile statistics cards"
          git push
