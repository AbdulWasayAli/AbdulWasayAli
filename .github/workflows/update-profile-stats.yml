name: Update profile stats cards

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/update-profile-stats.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=AbdulWasayAli&show_icons=true&rank_icon=default&theme=transparent&hide_border=true&title_color=56d6a3&text_color=c9d1d9&icon_color=56d6a3&bg_color=0d1117"
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=AbdulWasayAli&layout=compact&langs_count=5&size_weight=0.5&count_weight=0.5&theme=transparent&hide_border=true&title_color=56d6a3&text_color=c9d1d9&bg_color=0d1117"
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update profile statistics cards"
          git push
